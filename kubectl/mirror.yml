extends: ../mirror-base.yml

name: kubectl

# Logical index package `kubernetes/kubectl` at the physical path
# `ghcr.io/ocx-contrib/kubernetes/kubectl` — slash segments, never flattened.
# The first segment must be this repo's own GitHub owner: GITHUB_TOKEN only
# authorises packages owned by the repo the workflow runs in.
target:
  registry: ghcr.io
  repository: ocx-contrib/kubernetes/kubectl

# kubernetes/kubernetes GitHub releases carry NO binary assets — binaries ship
# from dl.k8s.io (the official release CDN, e.g.
# https://dl.k8s.io/release/v1.36.3/bin/linux/amd64/kubectl). The generator
# lists versions from GitHub releases and constructs the documented dl.k8s.io
# URL per platform — the same URL scheme the upstream install docs publish.
# Every constructed URL for every in-range version was HEAD-verified 200 at
# authoring (24 URLs, v1.36.0–v1.36.3); a future gap fails that platform's
# prepare download loudly (exit 74) rather than passing silently.
#
# `command` resolves against THIS spec's directory.
source:
  type: url_index
  generator:
    command: ["uv", "run", "scripts/generate.py"]
    timeout_seconds: 240

# ─── libc gate (Phase 3.5) — the evidence, not the conclusion ───────────────
#
# kubectl is pure-Go, built CGO_ENABLED=0 upstream. Byte-measured 2026-08-03
# on both Linux binaries from dl.k8s.io v1.36.3:
#
#   bin/linux/amd64/kubectl  ELF x86-64, statically linked
#                            readelf -l | grep -c INTERP → 0
#   bin/linux/arm64/kubectl  ELF aarch64, statically linked
#                            readelf -l | grep -c INTERP → 0
#
# No PT_INTERP means the artifact requires nothing of the host, so both Linux
# keys are BARE — no `+libc.*` suffix. The container legs (ubuntu + alpine +
# fedora) below turn that claim into evidence rather than an assertion.
#
# ─── Resolution, verified BOTH ways (2026-08-03) ────────────────────────────
#
# Asset names are generator-controlled (`kubectl-<os>-<arch>[.exe]`), one per
# platform per version — each pattern matches exactly one asset by
# construction, and all six exist for every in-range version (probed v1.36.0
# and v1.36.3, all 200). Upstream also ships 386/s390x/ppc64le and the
# node/control-plane binaries; the generator never emits them.
#
# Incremental rollout (Phase 10): linux first; darwin lands in pass 2 and
# windows in pass 3 — uncomment below and regenerate CI.
assets:
  linux/amd64:
    - "^kubectl-linux-amd64$"
  linux/arm64:
    - "^kubectl-linux-arm64$"
  # darwin/amd64:
  #   - "^kubectl-darwin-amd64$"
  # darwin/arm64:
  #   - "^kubectl-darwin-arm64$"
  # windows/amd64:
  #   - "^kubectl-windows-amd64\\.exe$"
  # windows/arm64:
  #   - "^kubectl-windows-arm64\\.exe$"

asset_type:
  # Raw binary on every platform — dl.k8s.io ships no archive. The asset lands
  # as `kubectl` (the Windows asset keeps its `.exe` suffix automatically).
  # `prepare` chmods declared `binaries` to 0755, which the bare download needs.
  type: binary
  name: kubectl

# No bin_scan: a raw-binary bundle's PATH is a bare ${installPath}, which the
# scan gate rejects (exit 65) — `off` + the hand-declared `binaries` claim in
# metadata.json is the blessed shape (mirror-bazelbuild/bazelisk precedent).

metadata:
  default: metadata.json

catalog:
  # Resolves against this spec's own directory; keeping the logo here puts it
  # inside this workflow's `kubectl/**` path trigger.
  # CATALOG.md is found by the default probe beside this file.
  logo: logo.svg

versions:
  # Owner decision 2026-08-03: 1.36.0 floor suffices (current stable line).
  # Older lines stay with upstream / OS package managers.
  min: "1.36.0"
  new_per_run: 5
  poll_interval: "0 */6 * * *"

tests:
  # `script:` resolves from the REPOSITORY ROOT — unlike `metadata.default` and
  # `catalog.logo` above, which resolve against this spec's own directory.
  - name: smoke
    script: kubectl/tests/smoke.star

# ─── Platform matrix — in the SPEC, not the base (mirror-kitware model) ─────
#
# The container legs are downstream of the libc measurement above, and this
# repo's future packages (kubelet, kube-proxy) will not share kubectl's
# verdict — so the whole block lives here, next to its evidence. Bare Linux
# keys claim universality: ubuntu (glibc) + alpine (musl) + fedora (different
# glibc vintage) are what prove it. Platforms declared here without a matching
# `assets:` key (darwin/windows until passes 2/3) never enter a version's
# resolved platform set — their legs self-skip and never red.
platforms:
  linux/amd64:
    runner: ubuntu-latest
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "alpine:3.20",  shell: sh }
      - { image: "fedora:40",    shell: bash }
  linux/arm64:
    # arm64 container legs run natively — no qemu — so the runner arch must
    # match the platform or the renderer reds the leg up front.
    runner: ubuntu-24.04-arm
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "alpine:3.20",  shell: sh }
      - { image: "fedora:40",    shell: bash }
  darwin/amd64:
    # Intel slice tested on the arm64 macos-14 runner via Rosetta 2 — GitHub's
    # native macos-13 Intel pool is exhausted and deadlocks the push job.
    runner: macos-14
    prefix: ["arch", "-x86_64"]
  darwin/arm64:
    runner: macos-14
    shell: bash
  windows/amd64:
    runner: windows-latest
    shell: pwsh
  windows/arm64:
    # Native arm64 Windows runner — the amd64 pool cannot execute an ARM64 PE.
    runner: windows-11-arm
    shell: pwsh
  # No `containers:` on darwin or windows — those runners have no Linux
  # container engine, and the key is rejected at spec load.

annotations:
  # From the Phase 1.5 license gate:
  #   $ gh api repos/kubernetes/kubernetes/license --jq '.license.spdx_id'
  #   Apache-2.0
  org.opencontainers.image.licenses: "Apache-2.0"

announce:
  # Spelled out, not derived from target.repository — the logical name and the
  # physical path are related by convention only.
  package: kubernetes/kubectl
  fork: ocx-contrib/index
